<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omsky TC | Event</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/REDYQ/RQ.online/refs/heads/main/asset/logo.jpg">
  <style>
    :root { --accent: #F44336; }
    * { -webkit-tap-highlight-color: transparent; outline: none !important; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-top: 70px; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

    header { 
      position: fixed; top: 0; left: 0; width: 100%; height: 60px;
      background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 20px; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
   .window {
  	margin: 5%;
 	 flex: 1;
 	 display: flex;
 	 flex-direction: column;
	  justify-content: center;
   }
  
    footer {
      height: 120px;
      margin-top: auto;
      padding: 40px 20px;
      background: #0d1117;
      border-top: 1px solid #30363d;
      text-align: center;
      color: #8b949e;
      font-size: 14px;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      text-decoration: underline;
    }
    
    h1 {
  	 overflow-wrap: break-word;
 	  margin-top: 30px;
	   margin-bottom: 15px;
 	  font-size: 16px;
	   font-weight: 600;
    }
    
    h2 {
   	margin-top: 80px;
  	 color: #2980b9;
 	  margin-bottom: 15px;
 	  font-size: 18px;
 	  font-weight: 600;
    }
    
	p {
	  font-size: 15px;
	  line-height: 1.4;
	  margin-top: 25px;
	  margin-bottom: 8px;
	}

	i {
		color: #BCBCBC;
	}
	
    li:not(:last-child) {
   	margin-bottom: 15px;
	}

	.divider {
	  color: #aaaaaa;
	  margin: 8px 0;
	  font-size: 15px;
	}

	.caution-block {
	  background-color: #1c2835;
	  border: none;
	  border-left: 3px solid #2f6ea5;
	  border-radius: 7px;
	  padding: 10px 35px 10px 12px;
	  color: #ffffff;
	  max-width: 500px;
	  margin-top: 4px;
	  margin-bottom: 12px;
	  position: relative;
	}

  .caution-content {
    font-size: 14px;
    line-height: 1.4;
  }

	.btn-outline {
	  display: block;
	  width: 100%;
	  max-width: 500px;
	  text-align: center;
	  padding: 12px 20px;
	  margin: 16px 0 24px 0;
	  background: transparent;
	  color: #2980b9;
	  border: 1.5px solid #2980b9;
	  border-radius: 6px;
	  font-size: 12px;
	  font-weight: 600;
	  text-decoration: none;
	  cursor: pointer;
	  transition: all 0.2s ease;
	}
	
	.btn-outline:hover {
	  background: rgba(41, 128, 185, 0.1);
	}

	#app_comment {
		position: static;
	    color: white;
	    padding: 8px 16px;
	    margin-bottom: 10px;
	    font-size: 10px;
	    text-align: center;
	    opacity: 0.3;
	}
  </style>
</head>
<body>
  <header>
    <div style="font-weight:bold" id="brand-name">Event</div>
  </header>

<h1 style="text-align: center">🏆 Розыгрыши Строительной Компании «OMSKY» <span style="font-size: 10px; color: #888888 !important;">[Black Russia / Green]</span></h1>  
 <div class="window">

<p>Нет активных розыгрышей...</p>
<div class="caution-block">
  <div class="caution-content">
    ⚡ Следи за обновлениями, чтобы не пропустить новый розыгрыш!
  </div>
</div>

</div>
 
 <div id="app_comment">Розыгрыши Строительной Компании «OMSKY» [Black Russia / Green]. Создано при поддержке RQ</div>
 
  <footer>
    <div>&copy; REDYQ | 2020-<span id="current-year"></span></div>

      <a href="mailto:commoncompanyredyq@gmail.com">Contact Us</a>
      <a href="https://redyq.github.io/RQ.online/policy">Privacy Policy</a>
      <a href="https://redyq.github.io/RQ.online/donate">Donate</a>
    </div>
  </footer>

  <script>
 	document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
